# Mutation testing configuration for the implemented milestones.
#
# The claim this repository makes is that the tests *are* the specification. Mutation testing is
# the only tool that checks that claim directly: break the implementation on purpose, and see
# whether the suite notices. A surviving mutant is, by definition, behaviour the specification
# does not pin down.
#
# Scope note: only milestones 1-3 are implemented. Everything under `tensorkit/nn/` and
# `tensorkit/optim/`, plus `losses.py`, is stubs raising NotImplementedError -- mutating a `raise`
# statement tells you nothing, so those are out of scope until the milestones land.
#
# Run one module at a time. The full suite takes about 9 seconds, and a whole-package session
# would be hours; per-module sessions are minutes.
#
#   cosmic-ray init cosmic-ray.toml session.sqlite
#   cosmic-ray baseline cosmic-ray.toml       # sanity: the suite passes unmutated
#   cosmic-ray exec cosmic-ray.toml session.sqlite
#   cr-report session.sqlite
#   cr-html session.sqlite > mutation-report.html
#
# Change `module-path` and `test-command` together -- pointing the whole suite at one mutated
# module wastes most of the runtime.

# ---------------------------------------------------------------------------------------------
# Windows: `python` in `test-command` may not be the interpreter you think
#
# Cosmic Ray runs the test command with `shlex.split()` and `subprocess.Popen`, passing an `env`
# dict. On Windows, CreateProcess resolves the *executable name* using the parent process's
# environment, not the `env` you hand it -- so a bare `python` can resolve to a system
# interpreter that has no pytest, even inside an activated virtualenv with the right PATH.
#
# The failure looks like this, and it is confusing because Cosmic Ray discards stderr:
#
#     Baseline failed. Execution with no mutation gives those following errors:
#     >>>
#
# An empty error block. The real message was on stderr:
# `C:\Program Files\Python312\python.exe: No module named pytest`.
#
# If you hit that, put the absolute interpreter path in `test-command`:
#
#     test-command = "C:/path/to/.venv/Scripts/python.exe -m pytest -x -q tests/test_scalar_autograd.py"
#
# On Linux and macOS an activated virtualenv resolves `python` correctly and the line below
# works as written.
# ---------------------------------------------------------------------------------------------

[cosmic-ray]
# Start here. `scalar.py` is milestone 1: 282 lines, pure Python, no NumPy import anywhere. It is
# both the easiest module to mutate meaningfully and the one whose invariants (I-ACCUM, I-ONCE,
# I-LEAF, I-SEED) matter most, because every later milestone inherits them.
module-path = "tensorkit/scalar.py"
timeout = 60.0
excluded-modules = []
test-command = "python -m pytest -x -q -p no:cacheprovider tests/test_scalar_autograd.py"

[cosmic-ray.distributor]
name = "local"

# ---------------------------------------------------------------------------------------------
# The other in-scope modules. Swap one of these into the block above.
#
#   module-path = "tensorkit/autograd.py"
#   test-command = "python -m pytest -x -q -p no:cacheprovider tests/test_scalar_autograd.py tests/test_tensor_autograd.py"
#
#   module-path = "tensorkit/broadcasting.py"
#   test-command = "python -m pytest -x -q -p no:cacheprovider tests/test_broadcasting.py"
#
#   module-path = "tensorkit/tensor.py"
#   test-command = "python -m pytest -x -q -p no:cacheprovider tests/test_tensor_autograd.py"
#
#   module-path = "tensorkit/ops.py"
#   test-command = "python -m pytest -x -q -p no:cacheprovider tests/test_ops.py"
#
#   module-path = "tensorkit/gradcheck.py"
#   test-command = "python -m pytest -x -q -p no:cacheprovider tests/test_gradcheck.py"
#
# `ops.py` is the big one -- 800 lines and 70 definitions -- and the most likely to hold
# surviving mutants, because a wrong gradient in a rarely-exercised op is exactly the kind of
# thing a hand-written suite misses.
#
# ---------------------------------------------------------------------------------------------
# Reading the results
#
# A *killed* mutant means the suite caught the change. A *survivor* means it did not, and there
# are only three explanations:
#
#   1. The test suite has a gap. This is a finding -- open a spec-defect issue.
#   2. The mutant is semantically equivalent to the original. Not a finding, but worth a comment
#      in the issue so the next person does not re-investigate it.
#   3. The mutated line is unreachable. Usually a finding about the code, not the tests.
#
# `-x` in the test command is deliberate: the first failure kills the mutant, and there is no
# value in running the remaining tests once that is known.
