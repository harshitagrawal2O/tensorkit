name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[all]"
      - run: python -m ruff check --output-format=github .
      - run: python -m ruff format --check .
      - run: python -m mypy

  collect:
    # The exam must stay valid on every platform we claim to support: every test importable,
    # every marker registered, no collection errors. This is the job that catches a broken
    # fixture or a test referencing a symbol the stubs do not define -- which would otherwise
    # look like an implementation failure to whoever picks up the milestone next.
    name: suite collects / py${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        os: [ubuntu-latest]
        include:
          - python-version: "3.12"
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[all]"
      - run: python -m pytest --collect-only -q --strict-markers --strict-config

  health:
    # Progress and suite health in one report -- see scripts/suite_health.py.
    #
    # This replaced eight matrix jobs, one per milestone, marked continue-on-error. That fixed
    # the workflow conclusion and nothing a visitor sees: each job still registers its own
    # check run, so a commit picked up a red cross and the checks panel announced "8 failing
    # checks" above the fold. Eight crosses that are supposed to be red communicate nothing.
    #
    # What this job does fail on is an error that is *not* a NotImplementedError from a stub.
    # A failing test is an unimplemented milestone; an error from anywhere else is a defect in
    # the exam, and it makes the affected milestone unstartable.
    name: suite health + progress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[all]"
      - run: python scripts/suite_health.py


  dependency-purity:
    name: NumPy-only import graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Fail if a deep-learning framework is installed at all
        run: |
          if python -m pip show torch >/dev/null 2>&1; then
            echo "::error::torch was installed by the core dependency set"
            exit 1
          fi
      - name: Static and runtime import audit
        run: python scripts/check_dependency_purity.py
      - name: The suite must still collect without torch installed
        run: python -m pytest --collect-only -q
