name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[all]"
      - run: python -m ruff check --output-format=github .
      - run: python -m ruff format --check .
      - run: python -m mypy

  suite:
    # The exam itself must stay valid: every test importable, every marker registered, no
    # collection errors. This is the job that catches a broken fixture or a test that
    # references a symbol the stubs do not define -- which would otherwise look like an
    # implementation failure to whoever picks up the milestone next.
    name: suite is well-formed / py${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        os: [ubuntu-latest]
        include:
          - python-version: "3.12"
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[all]"
      - name: Collect every test
        run: python -m pytest --collect-only -q --strict-markers --strict-config
      - name: Report how much is implemented
        shell: bash
        run: |
          python -m pytest -m "not slow" -q --no-header -rN 2>&1 | tail -3 || true
          echo "Failures here are expected: main ships the specification and the tests, not"
          echo "the implementation. Progress is tracked by the milestone jobs below."

  milestones:
    name: milestone m${{ matrix.milestone }}
    runs-on: ubuntu-latest
    continue-on-error: true   # unstarted milestones are expected to be red
    strategy:
      fail-fast: false
      matrix:
        milestone: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[all]"
      - run: python -m pytest -m "m${{ matrix.milestone }} and not slow" -q

  dependency-purity:
    name: NumPy-only import graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Fail if a deep-learning framework is installed at all
        run: |
          if python -m pip show torch >/dev/null 2>&1; then
            echo "::error::torch was installed by the core dependency set"
            exit 1
          fi
      - name: Static and runtime import audit
        run: python scripts/check_dependency_purity.py
      - name: The suite must still collect without torch installed
        run: python -m pytest --collect-only -q
