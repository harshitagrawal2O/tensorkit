[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tensorkit"
version = "0.1.0"
description = "A reverse-mode automatic differentiation engine and neural network library, in NumPy alone."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Harshit Agrawal", email = "harshit@deepstation.ai" }]
keywords = ["autograd", "automatic-differentiation", "numpy", "deep-learning", "neural-network", "from-scratch", "machine-learning", "education"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/harshitagrawal2O/tensorkit"
Issues = "https://github.com/harshitagrawal2O/tensorkit/issues"
Specification = "https://github.com/harshitagrawal2O/tensorkit/blob/main/SPEC.md"

[project.optional-dependencies]
bench = [
  "psutil>=5.9",
  "matplotlib>=3.8",
  "tabulate>=0.9",
]
dev = [
  "pytest>=8.2",
  "pytest-timeout>=2.3",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=3.7",
]
all = ["tensorkit[bench,dev]"]

[project.scripts]
tensorkit = "tensorkit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["tensorkit"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config --timeout=120"
markers = [
  "m1: milestone 1",
  "m2: milestone 2",
  "m3: milestone 3",
  "m4: milestone 4",
  "m5: milestone 5",
  "m6: milestone 6",
  "m7: milestone 7",
  "m8: milestone 8",
  "slow: takes more than ~10s; excluded from the default CI run",
  "crash: kills a subprocess to inject a crash",
  "socket: opens a real TCP socket on localhost",
  "property: hypothesis property-based test",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ANN", "D", "N", "SLF"]
ignore = [
  "D203", "D213", "ANN401", "E731",
  "RUF022", "RUF023",
  "N818",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "B011", "SLF001"]
"benchmarks/**" = ["D103", "ANN"]
"examples/**" = ["D103", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
# 3.12 rather than the package minimum: NumPy 2.x ships PEP 695 stubs that mypy only parses at
# 3.12+. Ruff still targets py311, so 3.12-only syntax in our own code is caught there.
python_version = "3.12"
packages = ["tensorkit"]
strict = true
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
# Third-party without stubs, plus the glue modules the CLI imports lazily. `benchmarks` and
# `examples` are scripts, not library surface; the strict config was never meant to cover them,
# and in a flattened layout they become importable, which changes how mypy resolves them.
module = [
  "tiktoken.*", "matplotlib.*", "psutil.*", "tabulate.*", "torch.*",
  "benchmarks.*", "train_mnist", "rubric.*",
]
ignore_missing_imports = true
follow_imports = "skip"
